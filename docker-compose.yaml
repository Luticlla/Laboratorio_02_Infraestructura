version: "0"
services:
  app1:
    build: ./api
    container_name: app1
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE_1}
    volumes:
      - app1-data:/opt/data
  app2:
    build: ./api
    container_name: app2
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE_2}
    volumes:
      - app2-data:/opt/data
  app3:
    build: ./api
    container_name: app3
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE_3}
    volumes:
      - app3-data:/opt/data
volumes:
  app1-data:
  app2-data:
  app3-data: